name: PSI probe (throwaway)

# One-off diagnostic: does the existing GEMINI_API_KEY also work for
# PageSpeed Insights and CrUX? Runs only when triggered by hand.
# Delete this file once the question is answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe PageSpeed Insights + CrUX
        env:
          GOOGLE_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          KEY = os.environ["GOOGLE_KEY"]
          PAGES = ["https://foldradar.com/", "https://foldradar.com/iphone-fold",
                   "https://foldradar.com/news"]
          CATS = ["performance", "accessibility", "best-practices", "seo"]

          def call(url, data=None):
              req = urllib.request.Request(
                  url, data=data,
                  headers={"Content-Type": "application/json"} if data else {})
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return json.load(r), None
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")[:600]
                  return None, f"HTTP {e.code}: {body}"
              except Exception as e:
                  return None, str(e)

          print("=" * 72)
          print("0. Control: is the key present, and does it work for Gemini?")
          print("=" * 72)
          print(f"   key present: {bool(KEY)}   length: {len(KEY)}")
          ctl, err = call(
              "https://generativelanguage.googleapis.com/v1beta/models"
              f"?key={KEY}&pageSize=1")
          if err:
              print(f"   Gemini API: REJECTED -> {err[:200]}")
          else:
              print("   Gemini API: ACCEPTED - the key itself is valid and live.")
          print()

          print("=" * 72)
          print("1. Does that same key work for PageSpeed Insights?")
          print("=" * 72)
          q = urllib.parse.urlencode(
              [("url", PAGES[0]), ("strategy", "mobile"), ("key", KEY)]
              + [("category", c) for c in CATS])
          probe, err = call(
              f"https://www.googleapis.com/pagespeedonline/v5/runPagespeed?{q}")
          if err:
              print(f"   REJECTED -> {err}")
              print("\n   Meaning: the key is not usable for PSI. Either the")
              print("   PageSpeed Insights API is not enabled on its project, or the")
              print("   key carries an API restriction limiting it to Gemini.")
              raise SystemExit(0)
          print("   ACCEPTED - the key works for PSI.\n")

          def report(data, label):
              lr = data.get("lighthouseResult", {})
              cats = lr.get("categories", {})
              scores = "  ".join(
                  f"{k}={round(v['score'] * 100) if v.get('score') is not None else '?'}"
                  for k, v in cats.items())
              print(f"   {label}: {scores}")
              au = lr.get("audits", {})
              for k in ("largest-contentful-paint", "cumulative-layout-shift",
                        "total-blocking-time", "first-contentful-paint", "speed-index"):
                  print(f"       {k:28s} {au.get(k, {}).get('displayValue', '-')}")
              le = data.get("loadingExperience", {})
              if le.get("metrics"):
                  print(f"       FIELD ({le.get('overall_category')}) id={le.get('id')}")
                  for m, v in le["metrics"].items():
                      print(f"         {m:36s} p75={v.get('percentile')} {v.get('category')}")
              else:
                  print("       FIELD: none returned for this URL")

          print("=" * 72)
          print("2. Lighthouse lab scores")
          print("=" * 72)
          report(probe, "/ (mobile)")
          for page in PAGES[1:]:
              q = urllib.parse.urlencode(
                  [("url", page), ("strategy", "mobile"), ("key", KEY)]
                  + [("category", c) for c in CATS])
              d, e = call(f"https://www.googleapis.com/pagespeedonline/v5/runPagespeed?{q}")
              if e:
                  print(f"   {page}: ERROR {e[:200]}")
              else:
                  report(d, f"{urllib.parse.urlparse(page).path or '/'} (mobile)")
          q = urllib.parse.urlencode(
              [("url", PAGES[0]), ("strategy", "desktop"), ("key", KEY)]
              + [("category", c) for c in CATS])
          d, e = call(f"https://www.googleapis.com/pagespeedonline/v5/runPagespeed?{q}")
          if e:
              print(f"   / (desktop): ERROR {e[:200]}")
          else:
              report(d, "/ (desktop)")

          print()
          print("=" * 72)
          print("3. CrUX API - real Chrome user field data")
          print("=" * 72)
          for body in ({"origin": "https://foldradar.com"},
                       {"url": "https://foldradar.com/"}):
              d, e = call(
                  f"https://chromeuxreport.googleapis.com/v1/records:queryRecord?key={KEY}",
                  json.dumps(body).encode())
              label = list(body)[0]
              if e:
                  short = "insufficient real-user traffic" if "404" in e else e[:220]
                  print(f"   {label}: no data - {short}")
                  continue
              rec = d.get("record", {})
              print(f"   {label}: DATA RETURNED")
              for m, v in rec.get("metrics", {}).items():
                  print(f"       {m:36s} p75={v.get('percentiles', {}).get('p75')}")
          PY
